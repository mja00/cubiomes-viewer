name: macOS Release

on:
  push:
    branches:
      - 'trunk'
    tags:
      - 'v*'

env:
  PROG:         cubiomes-viewer
  SOURCE_DIR:   ${{github.workspace}}

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version:    '6.7.3'
          host:       'mac'
          target:     'desktop'
          arch:       'clang_64'
          # qttools (lrelease, lupdate, etc.) is shipped as an archive of the
          # base install on Qt 6, not a selectable module. The default
          # archives list already includes it; do not pass `modules: qttools`.
          cache:      true

      - name: Build
        working-directory: ${{env.SOURCE_DIR}}
        run: |
          qmake CONFIG+=release ${{env.SOURCE_DIR}}
          make -j$(sysctl -n hw.ncpu)

      - name: Deploy
        working-directory: ${{env.SOURCE_DIR}}
        run: |
          macdeployqt ${{env.PROG}}.app -dmg

      # TODO: codesign + notarize. Requires repo secrets:
      #   APPLE_DEVELOPER_ID_CERT (base64 .p12), APPLE_DEVELOPER_ID_PASSWORD,
      #   APPLE_NOTARY_USER, APPLE_NOTARY_PASSWORD, APPLE_TEAM_ID.
      # - name: Codesign & notarize
      #   run: |
      #     codesign --deep --force --options runtime --timestamp \
      #       --sign "Developer ID Application: <Name> (<TEAM_ID>)" ${{env.PROG}}.app
      #     xcrun notarytool submit ${{env.PROG}}.dmg --wait \
      #       --apple-id "$APPLE_NOTARY_USER" --password "$APPLE_NOTARY_PASSWORD" \
      #       --team-id "$APPLE_TEAM_ID"
      #     xcrun stapler staple ${{env.PROG}}.dmg

      - name: Smoke test
        working-directory: ${{env.SOURCE_DIR}}
        run: |
          ./${{env.PROG}}.app/Contents/MacOS/${{env.PROG}} --version
          otool -L ./${{env.PROG}}.app/Contents/MacOS/${{env.PROG}}

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.PROG}}-macos-arm64
          path: ${{env.SOURCE_DIR}}/${{env.PROG}}.dmg
